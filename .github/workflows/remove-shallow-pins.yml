name: Remove shallow immutable renderer fetches
on:
  push:
    branches:
      - agent/phase1-5-cross-platform-ci
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phase1-5-cross-platform-ci
      - run: python3 .github/scripts/remove_shallow_pins.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fetch immutable renderer dependencies without shallow clones"
          git push
