name: Apply Renderer Skinning Contract

on:
  push:
    branches:
      - feature/gpu-skinning

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply renderer-neutral skinning contract
        run: python3 .github/scripts/apply_gpu_skinning_contract.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Renderer: integrate backend-neutral skinning contract"
          git push
