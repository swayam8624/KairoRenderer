name: Finalize D3D12 Skinning
on:
  push:
    branches: [feature/d3d12-gpu-skinning]
    paths: ['.github/workflows/finalize-d3d12-skinning.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/d3d12-gpu-skinning
      - run: python3 .github/scripts/finalize_d3d12_skinning.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Renderer: finalize D3D12 skin palette lifetime"
          git push origin HEAD:feature/d3d12-gpu-skinning
