name: Vulkan opaque instancing contract
on:
  pull_request:
    paths:
      - 'VulkanTriangle.cppm'
      - 'shaders/triangle.vert'
      - 'shaders/triangle.frag'
      - 'detail/InstanceRuns.hpp'
      - 'tests/InstanceRunsTests.cpp'
      - '.github/workflows/opaque-instancing.yml'
  push:
    branches: [main, feat/vulkan-opaque-instancing]
permissions:
  contents: read
jobs:
  run-planner-and-shaders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GLSL and SPIR-V validators
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
      - name: Compile and exercise exact C++23 instance planner
        run: |
          mkdir -p build/instancing
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer tests/InstanceRunsTests.cpp -o build/instancing/test
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 build/instancing/test | tee build/instancing/test.log
      - name: Link ordinary, skinned and instanced shader interfaces
        run: |
          glslangValidator -V -l shaders/triangle.vert shaders/triangle.frag
          spirv-val vert.spv
          spirv-val frag.spv
          glslangValidator -V -l shaders/skinned_triangle.vert shaders/triangle.frag
          spirv-val vert.spv
          spirv-val frag.spv
          glslangValidator -V -DKAIRO_INSTANCED=1 -l shaders/triangle.vert shaders/triangle.frag
          spirv-val vert.spv
          spirv-val frag.spv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opaque-instancing-diagnostics
          path: build/instancing/test.log
          if-no-files-found: warn
