name: Agent OpenGL Fine Pass Patch

on:
  push:
    branches:
      - complete/opengl-fine-frame-passes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/opengl-fine-frame-passes
          fetch-depth: 0
      - name: Split OpenGL viewport into native graph passes
        shell: python
        run: |
          from pathlib import Path
          import re

          renderer = Path('OpenGLRenderer.cppm')
          text = renderer.read_text()

          new_draw_frame = r'''        /// Task: execute the OpenGL frame as graph-owned native stages. Each
        /// viewport phase owns a real callback while sharing the persistent
        /// framebuffer/depth attachments through explicit graph dependencies.
        void DrawFrame()
        {
            glfwMakeContextCurrent(m_Window.NativeHandle());
            const auto [windowWidth, windowHeight] = m_Window.FramebufferExtent();
            if (windowWidth == 0u || windowHeight == 0u)
            {
                m_LastFrameProfile = {};
                return;
            }

            const auto shadowIndex = ShadowLightIndex();
            const auto lightViewProjection = BuildLightViewProjection(shadowIndex);
            const bool shadowPassEnabled =
                shadowIndex.has_value() && m_ShadowSettings.Enabled;
            const bool readbackRequested =
                m_PickRequest.has_value() || m_CaptureRequested;
            const bool toolingRequested = static_cast<bool>(m_OverlayRecorder);

            RenderGraph graph;
            const auto shadow = graph.AddResource({ "OpenGLShadowDepth",
                RenderResourceKind::External, 0u, false,
                RenderResourceState::ShaderRead });
            const auto viewport = graph.AddResource({ "OpenGLViewport",
                RenderResourceKind::External, 0u, false,
                RenderResourceState::ShaderRead });
            const auto nativeFrame = graph.AddResource({ "OpenGLDefaultFramebuffer",
                RenderResourceKind::External, 0u, false,
                RenderResourceState::Present });

            std::optional<RenderPassHandle> shadowPass;
            if (shadowPassEnabled)
            {
                shadowPass = graph.AddPass("Shadow", {
                    { shadow, RenderAccessMode::Write,
                        RenderResourceState::DepthAttachment }
                }, [this, &lightViewProjection]
                {
                    DrawShadowPass(lightViewProjection);
                });
            }

            const auto opaquePass = graph.AddPass("Opaque", {
                { shadow, RenderAccessMode::Read,
                    RenderResourceState::ShaderRead },
                { viewport, RenderAccessMode::Write,
                    RenderResourceState::ColorAttachment }
            }, [this, &lightViewProjection, shadowIndex]
            {
                DrawOpaquePass(lightViewProjection, shadowIndex);
            });
            if (shadowPass.has_value()) graph.DependsOn(opaquePass, *shadowPass);

            const auto transparentPass = graph.AddPass("Transparent", {
                { shadow, RenderAccessMode::Read,
                    RenderResourceState::ShaderRead },
                { viewport, RenderAccessMode::ReadWrite,
                    RenderResourceState::ColorAttachment }
            }, [this, &lightViewProjection, shadowIndex]
            {
                DrawTransparentPass(lightViewProjection, shadowIndex);
            });
            graph.DependsOn(transparentPass, opaquePass);

            const auto debugPass = graph.AddPass("Debug", {
                { viewport, RenderAccessMode::ReadWrite,
                    RenderResourceState::ColorAttachment }
            }, [this]
            {
                DrawDebugPass();
            });
            graph.DependsOn(debugPass, transparentPass);

            std::optional<RenderPassHandle> readbackPass;
            if (readbackRequested)
            {
                readbackPass = graph.AddPass("Readback", {
                    { viewport, RenderAccessMode::Read,
                        RenderResourceState::CopySource }
                }, [this]
                {
                    CompleteReadbacks();
                });
                graph.DependsOn(*readbackPass, debugPass);
            }

            const auto blitPass = graph.AddPass("Blit", {
                { viewport, RenderAccessMode::Read,
                    RenderResourceState::CopySource },
                { nativeFrame, RenderAccessMode::Write,
                    RenderResourceState::ColorAttachment }
            }, [this, windowWidth, windowHeight]
            {
                Present(windowWidth, windowHeight);
            });
            graph.DependsOn(blitPass,
                readbackPass.has_value() ? *readbackPass : debugPass);

            std::optional<RenderPassHandle> toolingPass;
            if (toolingRequested)
            {
                toolingPass = graph.AddPass("Tooling", {
                    { nativeFrame, RenderAccessMode::ReadWrite,
                        RenderResourceState::ColorAttachment }
                }, [this]
                {
                    m_OverlayRecorder();
                });
                graph.DependsOn(*toolingPass, blitPass);
            }

            const auto presentPass = graph.AddPass("Present", {
                { nativeFrame, RenderAccessMode::ReadWrite,
                    RenderResourceState::Present }
            }, [this]
            {
                glfwSwapBuffers(m_Window.NativeHandle());
            });
            graph.DependsOn(presentPass,
                toolingPass.has_value() ? *toolingPass : blitPass);

            m_LastFrameProfile = graph.Compile().Execute();
        }
'''

          pattern = re.compile(
              r'        /// Task: execute the OpenGL frame as real graph-owned native stages\.\n.*?'
              r'        void DrawFrame\(\)\n        \{.*?\n        \}\n\n'
              r'(?=        \[\[nodiscard\]\] const RenderGraphExecutionProfile& LastFrameProfile\(\))',
              re.S)
          text, count = pattern.subn(new_draw_frame + '\n', text, count=1)
          if count != 1:
              raise SystemExit(f'failed to replace DrawFrame: {count}')

          new_viewport_stages = r'''        void BeginViewportMeshPass(
            const kairo::foundation::math::Mat4f& lightViewProjection,
            std::optional<std::size_t> shadowIndex) const
        {
            glBindFramebuffer(GL_FRAMEBUFFER, m_ViewportFramebuffer);
            glViewport(0, 0, CheckedGLDimension(m_ViewportWidth),
                CheckedGLDimension(m_ViewportHeight));
            constexpr GLenum attachments[]{ GL_COLOR_ATTACHMENT0,
                GL_COLOR_ATTACHMENT1 };
            glDrawBuffers(2, attachments);
            glEnable(GL_DEPTH_TEST);
            glEnable(GL_CULL_FACE);
            glCullFace(GL_BACK);
            glUseProgram(m_MeshProgram);
            UploadFrameUniforms(lightViewProjection, shadowIndex);
            glActiveTexture(GL_TEXTURE0);
            glBindTexture(GL_TEXTURE_2D, m_ShadowDepth);
        }

        void DrawOpaquePass(
            const kairo::foundation::math::Mat4f& lightViewProjection,
            std::optional<std::size_t> shadowIndex)
        {
            BeginViewportMeshPass(lightViewProjection, shadowIndex);
            const GLfloat clearColor[]{ m_Environment.BackgroundColor.x,
                m_Environment.BackgroundColor.y,
                m_Environment.BackgroundColor.z, 1.0f };
            constexpr GLuint clearID[]{ 0u };
            constexpr GLfloat clearDepth[]{ 1.0f };
            glClearBufferfv(GL_COLOR, 0, clearColor);
            glClearBufferuiv(GL_COLOR, 1, clearID);
            glClearBufferfv(GL_DEPTH, 0, clearDepth);
            glDepthMask(GL_TRUE);
            glDisable(GL_BLEND);

            for (std::size_t index = 0u; index < m_Draws.size(); ++index)
                if (m_Draws[index].Material.AlphaMode != MaterialAlphaMode::Blend)
                    DrawOne(m_Draws[index]);
        }

        void DrawTransparentPass(
            const kairo::foundation::math::Mat4f& lightViewProjection,
            std::optional<std::size_t> shadowIndex)
        {
            BeginViewportMeshPass(lightViewProjection, shadowIndex);
            std::vector<std::size_t> transparent;
            transparent.reserve(m_Draws.size());
            for (std::size_t index = 0u; index < m_Draws.size(); ++index)
                if (m_Draws[index].Material.AlphaMode == MaterialAlphaMode::Blend)
                    transparent.push_back(index);

            using kairo::foundation::math::Dot;
            using kairo::foundation::math::ExtractTranslation;
            const auto cameraPosition = m_Camera.Position();
            std::stable_sort(transparent.begin(), transparent.end(),
                [&](std::size_t left, std::size_t right)
                {
                    const auto a = ExtractTranslation(m_Draws[left].Model) - cameraPosition;
                    const auto b = ExtractTranslation(m_Draws[right].Model) - cameraPosition;
                    return Dot(a, a) > Dot(b, b);
                });
            if (!transparent.empty())
            {
                glEnablei(GL_BLEND, 0u);
                glDisablei(GL_BLEND, 1u);
                glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);
                glDepthMask(GL_FALSE);
                for (const std::size_t index : transparent) DrawOne(m_Draws[index]);
                glDepthMask(GL_TRUE);
                glDisablei(GL_BLEND, 0u);
            }
        }

        void DrawDebugPass()
        {
            glBindFramebuffer(GL_FRAMEBUFFER, m_ViewportFramebuffer);
            glViewport(0, 0, CheckedGLDimension(m_ViewportWidth),
                CheckedGLDimension(m_ViewportHeight));
            DrawDebugLines();
            glBindVertexArray(0u);
            glUseProgram(0u);
            glBindFramebuffer(GL_FRAMEBUFFER, 0u);
            ThrowIfGLError("rendering an OpenGL frame");
        }
'''

          pattern = re.compile(
              r'        void DrawViewportPass\(.*?\n        \}\n\n'
              r'(?=        void UploadFrameUniforms\()', re.S)
          text, count = pattern.subn(new_viewport_stages + '\n', text, count=1)
          if count != 1:
              raise SystemExit(f'failed to replace viewport stages: {count}')
          renderer.write_text(text)

          tests = Path('tests/RenderGraphExecutionPlanTests.cpp')
          t = tests.read_text()
          old = '''    runtime.DrawFrame();
    const auto& baseProfile = runtime.LastFrameProfile();
    REQUIRE(baseProfile.Passes.size() == 3u);
    CHECK(baseProfile.Passes[0u].Name == "Viewport");
    CHECK(baseProfile.Passes[1u].Name == "Blit");
    CHECK(baseProfile.Passes[2u].Name == "Present");

    runtime.RequestViewportCapture();
    runtime.DrawFrame();
    const auto& captureProfile = runtime.LastFrameProfile();
    REQUIRE(captureProfile.Passes.size() == 4u);
    CHECK(captureProfile.Passes[0u].Name == "Viewport");
    CHECK(captureProfile.Passes[1u].Name == "Readback");
    CHECK(captureProfile.Passes[2u].Name == "Blit");
    CHECK(captureProfile.Passes[3u].Name == "Present");'''
          new = '''    runtime.DrawFrame();
    const auto& baseProfile = runtime.LastFrameProfile();
    REQUIRE(baseProfile.Passes.size() == 5u);
    CHECK(baseProfile.Passes[0u].Name == "Opaque");
    CHECK(baseProfile.Passes[1u].Name == "Transparent");
    CHECK(baseProfile.Passes[2u].Name == "Debug");
    CHECK(baseProfile.Passes[3u].Name == "Blit");
    CHECK(baseProfile.Passes[4u].Name == "Present");

    runtime.RequestViewportCapture();
    runtime.DrawFrame();
    const auto& captureProfile = runtime.LastFrameProfile();
    REQUIRE(captureProfile.Passes.size() == 6u);
    CHECK(captureProfile.Passes[0u].Name == "Opaque");
    CHECK(captureProfile.Passes[1u].Name == "Transparent");
    CHECK(captureProfile.Passes[2u].Name == "Debug");
    CHECK(captureProfile.Passes[3u].Name == "Readback");
    CHECK(captureProfile.Passes[4u].Name == "Blit");
    CHECK(captureProfile.Passes[5u].Name == "Present");'''
          if old not in t:
              raise SystemExit('base/capture smoke expectations not found')
          t = t.replace(old, new, 1)
          old = '''    const auto& toolingProfile = runtime.LastFrameProfile();
    REQUIRE(toolingProfile.Passes.size() == 4u);
    CHECK(toolingProfile.Passes[0u].Name == "Viewport");
    CHECK(toolingProfile.Passes[1u].Name == "Blit");
    CHECK(toolingProfile.Passes[2u].Name == "Tooling");
    CHECK(toolingProfile.Passes[3u].Name == "Present");'''
          new = '''    const auto& toolingProfile = runtime.LastFrameProfile();
    REQUIRE(toolingProfile.Passes.size() == 6u);
    CHECK(toolingProfile.Passes[0u].Name == "Opaque");
    CHECK(toolingProfile.Passes[1u].Name == "Transparent");
    CHECK(toolingProfile.Passes[2u].Name == "Debug");
    CHECK(toolingProfile.Passes[3u].Name == "Blit");
    CHECK(toolingProfile.Passes[4u].Name == "Tooling");
    CHECK(toolingProfile.Passes[5u].Name == "Present");'''
          if old not in t:
              raise SystemExit('tooling smoke expectations not found')
          tests.write_text(t.replace(old, new, 1))

      - name: Commit source migration and remove patch workflow
        shell: bash
        run: |
          rm .github/workflows/agent_opengl_fine_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OpenGLRenderer.cppm tests/RenderGraphExecutionPlanTests.cpp .github/workflows/agent_opengl_fine_patch.yml
          git commit -m "RenderGraph: split OpenGL viewport native stages"
          git push origin HEAD:complete/opengl-fine-frame-passes
