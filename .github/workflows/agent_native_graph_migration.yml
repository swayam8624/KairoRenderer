name: Agent Native Graph Migration

on:
  push:
    branches:
      - complete/all-native-frame-graphs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: complete/all-native-frame-graphs
          fetch-depth: 0
      - name: Apply remaining native graph migrations
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit source migration and remove patch workflow
        shell: bash
        run: |
          rm .github/workflows/agent_native_graph_migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Renderer.cppm VulkanRenderer.cppm MetalRenderer.cppm Direct3D12Renderer.cppm .github/workflows/agent_native_graph_migration.yml
          git commit -m 'RenderGraph: migrate all native frame lifecycles'
          git push origin HEAD:complete/all-native-frame-graphs
