name: Update Physics V1 Fallback Pin

on:
  push:
    branches:
      - fix/physics-v1-fallback-pin

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance PhysicsEngine fallback
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text()
          old = 'set(KAIRO_RENDERER_PHYSICS_REVISION 180016b1c91e7b34731491f2616e64e450ea24e5)'
          new = 'set(KAIRO_RENDERER_PHYSICS_REVISION e7dfcb712dd70c865ebe03189e765c0df15b6bed)'
          if old not in text:
              if new not in text:
                  raise SystemExit('expected PhysicsEngine fallback pin not found')
          else:
              path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/update-physics-v1-pin.yml').unlink()
          PY
      - name: Commit pin update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build: advance PhysicsEngine V1 fallback pin"
          git push
